# ======================================================================
# |  api-gateway  -  entry point, routing and edge security            |
# |  Port: 8080                                                        |
# ======================================================================

server.port=8080

# pure routing/security layer - static resource handling would interfere
# with route matching
spring.web.resources.add-mappings=false


# ----------------------------------------------------------------------
# ROUTING - discover routes from Eureka by service id
# ----------------------------------------------------------------------

spring.cloud.gateway.discovery.locator.enabled=false
spring.cloud.gateway.discovery.locator.lower-case-service-id=true


# ----------------------------------------------------------------------
# TIMEOUTS
# ----------------------------------------------------------------------

spring.cloud.gateway.httpclient.connect-timeout=3000
spring.cloud.gateway.httpclient.response-timeout=15s


# ----------------------------------------------------------------------
# CORS - tighten per environment via api-gateway-prod.properties
# ----------------------------------------------------------------------

gateway.cors.allowed-origins=http://localhost:3000,http://localhost:5173
gateway.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
gateway.cors.allowed-headers=*
gateway.cors.allow-credentials=true
gateway.cors.max-age=3600


# ----------------------------------------------------------------------
# SECRETS
# ----------------------------------------------------------------------
# JWT signing key and any datasource password are NOT stored here.
# Keep them in the service's local properties, in an environment variable,
# or add them as encrypted values, e.g.
#   jwt.secret={cipher}AQB1c...

logging.level.org.springframework.cloud.gateway=INFO

