# ======================================================================
# |                 SHARED CONFIGURATION - ALL SERVICES                |
# |                                                                    |
# |  Served by : national-exchange-config-service (port 7071)          |
# |  Applies to: every service that imports the config server          |
# |  Precedence: lowest - a <service>.properties file overrides this   |
# |                                                                    |
# |  PUBLIC REPOSITORY - no plaintext secrets. Use {cipher} values.    |
# ======================================================================


# ----------------------------------------------------------------------
# SERVICE DISCOVERY - EUREKA
# ----------------------------------------------------------------------

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}


# ----------------------------------------------------------------------
# ACTUATOR
# ----------------------------------------------------------------------

# refresh  -> re-read config for @RefreshScope beans
# busrefresh -> broadcast a refresh to every service over RabbitMQ
management.endpoints.web.exposure.include=health,info,refresh,busrefresh,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.info.env.enabled=true


# ----------------------------------------------------------------------
# SPRING CLOUD BUS - RabbitMQ transport for /actuator/busrefresh
# ----------------------------------------------------------------------

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672

# every bus participant must share this virtual host, or a busrefresh
# published by the config server never reaches the other services.
# must match RABBITMQ_DEFAULT_VHOST in NationalExchangeDocker/docker-compose.yml
spring.rabbitmq.virtual-host=national-exchange

# credentials intentionally omitted - this repository is public.
# set them per environment (env vars) or per service local properties.


# ----------------------------------------------------------------------
# CONFIG CLIENT BEHAVIOUR
# ----------------------------------------------------------------------

# fail fast at startup if the config server cannot be reached, then retry
spring.cloud.config.fail-fast=true
spring.cloud.config.retry.initial-interval=1000
spring.cloud.config.retry.max-attempts=6
spring.cloud.config.retry.max-interval=2000
spring.cloud.config.retry.multiplier=1.5


# ----------------------------------------------------------------------
# JACKSON / HTTP
# ----------------------------------------------------------------------

spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=never


# ----------------------------------------------------------------------
# LOGGING
# ----------------------------------------------------------------------

logging.level.root=INFO
logging.level.com.national.exchange=INFO
logging.level.com.rabbitmq.client.impl=WARN
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]


# ----------------------------------------------------------------------
# TRACING
# ----------------------------------------------------------------------

management.tracing.sampling.probability=1.0

# ----------------------------------------------------------------------
# JWT - SHARED SIGNING SECRET
# ----------------------------------------------------------------------

# every service that issues or verifies a token reads these two values
# from here, so the secret exists in exactly one place.
# the value is AES encrypted with encrypt.key held by the config server;
# the config server decrypts it before serving it to a client.
# rotate it by re-encrypting via POST /encrypt and committing the new
# {cipher} value, then POST /actuator/busrefresh.
jwt.secret={cipher}b29830834adf058808ad39eeab719637b3c4cdd90ce0b0642b40ca34b163956f312927ca13cd2222aa6150266edf4f82d0c0b746808300b33a21fb4599880d224f2d6f4e32deaf8fa906715f1daa61acbf9def1b3ed46c32d2535904965cb5f73a4975aa02f88eea5a372684a9d61a65
jwt.expiration=3600000
