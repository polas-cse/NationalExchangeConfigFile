# ======================================================================
# |  discovery-server  -  Eureka registry                              |
# |  Port: 8761                                                        |
# ======================================================================

server.port=8761

# the registry itself must not try to register with, or fetch from, itself
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false

# keep self-preservation on outside development so a network blip does not
# evict healthy instances
eureka.server.enable-self-preservation=true
eureka.server.eviction-interval-timer-in-ms=15000

management.endpoints.web.exposure.include=health,info,refresh,busrefresh,metrics,prometheus
