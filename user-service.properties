# ======================================================================
# |  user-service  -  accounts, authentication, profiles               |
# |  Port: 9090   Database: PostgreSQL national-exchange / user_service    |
# ======================================================================

server.port=9090


# ----------------------------------------------------------------------
# DATABASE - R2DBC (reactive) + JDBC (Liquibase only)
# ----------------------------------------------------------------------
# the schema must be set in the URL; spring.r2dbc.properties.schema is
# ignored by the PostgreSQL R2DBC driver
spring.r2dbc.url=r2dbc:postgresql://localhost:5432/national-exchange?schema=user_service
spring.datasource.url=jdbc:postgresql://localhost:5432/national-exchange
spring.datasource.driver-class-name=org.postgresql.Driver

# credentials are NOT stored in this public repository - keep them local,
# in environment variables, or add them encrypted:
#   spring.r2dbc.password={cipher}AQB1c...


# ----------------------------------------------------------------------
# LIQUIBASE - tracking tables must live in the same schema as the tables
# ----------------------------------------------------------------------
spring.liquibase.default-schema=user_service
spring.liquibase.liquibase-schema=user_service


# ----------------------------------------------------------------------
# MESSAGING - RabbitMQ virtual host shared with bank-service
# ----------------------------------------------------------------------
spring.rabbitmq.virtual-host=national-exchange
spring.rabbitmq.connection-timeout=10000
spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.missing-queues-fatal=false
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.initial-interval=2000
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.multiplier=2.0
spring.rabbitmq.listener.simple.retry.max-interval=6000


# ----------------------------------------------------------------------
# gRPC CLIENT -> bank-service
# ----------------------------------------------------------------------
grpc.client.bank-service.address=localhost:9191
grpc.client.bank-service.negotiation-type=plaintext
# service-discovery form, once TLS is in place:
#grpc.client.bank-service.address=discovery:///bank-service
#grpc.client.bank-service.negotiation-type=tls


# ----------------------------------------------------------------------
# JWT - lifetimes only. The signing key stays out of this repository.
# ----------------------------------------------------------------------
jwt.expiration=86400000
jwt.refresh-expiration=604800000


logging.level.net.devh.boot.grpc.client=INFO
