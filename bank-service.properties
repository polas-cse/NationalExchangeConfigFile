spring.r2dbc.url=r2dbc:postgresql://localhost:5432/bank-service?schema=banking_service
spring.datasource.url=jdbc:postgresql://localhost:5432/bank-service
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=bank-service
spring.datasource.password={cipher}de3b528b792abb2577edee5d3cadf61f93b4b88578fa7070fc35c51c993f5b12
spring.r2dbc.username=bank-service
spring.r2dbc.password={cipher}de3b528b792abb2577edee5d3cadf61f93b4b88578fa7070fc35c51c993f5b12
spring.liquibase.url=jdbc:postgresql://localhost:5432/bank-service
spring.liquibase.user=bank-service
spring.liquibase.password={cipher}de3b528b792abb2577edee5d3cadf61f93b4b88578fa7070fc35c51c993f5b12

# credentials are NOT stored in this public repository - keep them local,
# in environment variables, or add them encrypted:
#   spring.r2dbc.password={cipher}AQB1c...


# ----------------------------------------------------------------------
# LIQUIBASE
# ----------------------------------------------------------------------
spring.liquibase.default-schema=banking_service
spring.liquibase.liquibase-schema=banking_service


# ----------------------------------------------------------------------
# gRPC SERVER - consumed by user-service
# ----------------------------------------------------------------------
grpc.server.port=9191


# ----------------------------------------------------------------------
# MESSAGING - RabbitMQ virtual host shared with user-service
# ----------------------------------------------------------------------
spring.rabbitmq.virtual-host=national-exchange
spring.rabbitmq.connection-timeout=10000
spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.missing-queues-fatal=false
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.initial-interval=500
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.multiplier=2.0
spring.rabbitmq.listener.simple.retry.max-interval=3000


logging.level.net.devh.boot.grpc.server=INFO
